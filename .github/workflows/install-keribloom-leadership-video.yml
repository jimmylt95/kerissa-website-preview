name: Install KeriBloom leadership video

on:
  push:
    paths:
      - ".github/workflows/install-keribloom-leadership-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add video section assets to homepage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          css = '<link rel="stylesheet" href="assets/css/keribloom-leadership-video.css">'
          js = '<script src="assets/js/keribloom-leadership-video.js"></script>'

          changed = False
          if css not in text:
              if "</head>" not in text:
                  raise SystemExit("Could not find </head> in index.html")
              text = text.replace("</head>", f"  {css}\n</head>", 1)
              changed = True

          if js not in text:
              if "</body>" not in text:
                  raise SystemExit("Could not find </body> in index.html")
              text = text.replace("</body>", f"  {js}\n</body>", 1)
              changed = True

          if changed:
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Homepage already contains the video assets."
            exit 0
          fi
          git commit -m "Add KeriBloom leadership video to homepage"
          git push
