name: Export KeriBloom poster

on:
  push:
    paths:
      - ".github/workflows/export-keribloom-poster.yml"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: keribloom-gfi-poster
          path: assets/media/events/2026-09-gfi-team-event/keribloom-gfi-south-carolina-city-tour-june-2026-thumbnail.png
          if-no-files-found: error
